name: Evidence policy and live FalkorDB tests
on:
  push:
  pull_request:
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Verify optional MCP tool server imports
        run: |
          python -m pip install -r requirements-mcp.txt
          python -c "from app.track1_mcp import mcp; assert mcp is not None"
      - run: python -m pytest -q tests/test_decisions.py tests/test_baseline.py tests/test_resolve_intake.py tests/test_track1_agent.py
      - run: python -m scripts.proof_report
      - name: Check judge interface JavaScript and DOM bindings
        run: python -m scripts.check_frontend
  ui-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser testing library
        run: python -m pip install playwright==1.56.0
      - name: Start static judge demo
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory app/static >/tmp/sahiaaya-ui.log 2>&1 &
          sleep 2
      - name: Test first look, guided settlement and mobile layout
        run: python -m scripts.ui_browser_check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sahiaaya-browser-screenshots
          path: docs/screenshots/judge-*.png
          if-no-files-found: ignore
  falkordb-integration:
    runs-on: ubuntu-latest
    services:
      graph:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Test Cypher-backed decisions, reviewed allocations and graph safety
        env:
          RUN_FALKOR_TESTS: "1"
          FALKOR_HOST: "localhost"
          FALKOR_PORT: "6379"
        run: python -m pytest tests/test_falkor_integration.py tests/test_graph_safety.py tests/test_resolve_intake.py -v
      - name: End-to-end browser workflow using live FalkorDB
        env:
          FALKOR_HOST: localhost
          FALKOR_PORT: "6379"
          ALLOW_DEMO_RESET: "1"
          ALLOW_DEMO_MUTATIONS: "1"
          SAHIAAYA_UI_URL: http://127.0.0.1:8766/
          SAHIAAYA_EXPECT_BACKEND: falkordb
        run: |
          python -m pip install playwright==1.56.0
          uvicorn app.server:app --host 127.0.0.1 --port 8766 >/tmp/sahiaaya-fastapi.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8766/api/health >/dev/null; then break; fi
            sleep 1
          done
          python -m scripts.ui_browser_check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sahiaaya-live-graph-browser-screenshots
          path: docs/screenshots/judge-live-*.png
          if-no-files-found: ignore
