name: Evidence policy and live FalkorDB tests
on:
  push:
  pull_request:
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Verify optional MCP tool server imports
        run: |
          python -m pip install -r requirements-mcp.txt
          python -c "from app.track1_mcp import mcp; assert mcp is not None"
      - run: python -m pytest -q tests/test_decisions.py tests/test_baseline.py tests/test_resolve_intake.py tests/test_track1_agent.py tests/test_track1_counterfactual.py tests/test_ledger.py
      - name: Compile real-model acceptance and recording utilities
        run: python -m compileall -q app scripts
      - run: python -m scripts.proof_report
      - name: Check judge interface JavaScript and DOM bindings
        run: python -m scripts.check_frontend
  ui-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser testing library
        run: python -m pip install playwright==1.56.0
      - name: Start static judge demo
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory app/static >/tmp/sahiaaya-ui.log 2>&1 &
          sleep 2
      - name: Test first look, guided settlement and mobile layout
        run: python -m scripts.ui_browser_check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sahiaaya-browser-screenshots
          path: docs/screenshots/judge-*.png
          if-no-files-found: ignore
  falkordb-integration:
    runs-on: ubuntu-latest
    services:
      graph:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Test Cypher-backed decisions, reviewed allocations and graph safety
        env:
          RUN_FALKOR_TESTS: "1"
          FALKOR_HOST: "localhost"
          FALKOR_PORT: "6379"
          SAHIAAYA_REQUIRE_GRAPH_MAXFLOW: "1"
        run: |
          python -m pip install -r requirements-mcp.txt
          python -c "from falkordb import FalkorDB; g=FalkorDB(host='localhost',port=6379).select_graph('probe'); names=[r[0] for r in g.query('CALL dbms.procedures() YIELD name RETURN name').result_set]; print('::notice title=FalkorDB algorithms::'+', '.join(n for n in names if n.startswith('algo.')))"
          python -m pytest tests/test_falkor_integration.py tests/test_graph_safety.py tests/test_resolve_intake.py tests/test_track1_agent.py tests/test_track1_counterfactual.py tests/test_ledger.py -v --junitxml=/tmp/live-tests.xml
      - name: Report failing live tests as annotations
        if: failure()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for case in ET.parse('/tmp/live-tests.xml').iter('testcase'):
              for bad in list(case.iter('failure'))+list(case.iter('error')):
                  msg=(bad.get('message') or '')[:300].replace('\n',' ')
                  text=(bad.text or '').strip().splitlines()[-6:]
                  print(f"::error title={case.get('name')}::{msg} || "+' | '.join(t.strip()[:160] for t in text))
          PY
      - name: Print a fresh public-preview replay recording
        if: always()
        env:
          FALKOR_HOST: localhost
          FALKOR_PORT: "6379"
        run: python -c "import subprocess,sys; out=subprocess.run([sys.executable,'-m','scripts.record_ledger_replay'],capture_output=True,text=True,check=True).stdout.strip(); print('::notice title=Ledger replay::'+out.replace('%','%25'))"
      - name: Benchmark greedy per-row logic vs graph reconciliation on live FalkorDB
        env:
          FALKOR_HOST: localhost
          FALKOR_PORT: "6379"
          SAHIAAYA_REQUIRE_GRAPH_MAXFLOW: "1"
        run: |
          python -m scripts.benchmark --cases 60 --noise 0.15 --live --out docs/benchmark_results.json > /dev/null
          python -c "import json; d=json.load(open('docs/benchmark_results.json')); [print('::notice title=Benchmark '+k+'::engine='+d['engine']+' delivered='+str(v['delivered_units'])+' sql_agree='+v['graph_equals_equally_informed_sql_flow']+' '+json.dumps(v['methods'])) for k,v in d['results'].items()]"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sahiaaya-ledger-benchmark
          path: docs/benchmark_results.json
          if-no-files-found: ignore
      - name: End-to-end browser workflow using live FalkorDB
        env:
          FALKOR_HOST: localhost
          FALKOR_PORT: "6379"
          ALLOW_DEMO_RESET: "1"
          ALLOW_DEMO_MUTATIONS: "1"
          SAHIAAYA_UI_URL: http://127.0.0.1:8766/
          SAHIAAYA_EXPECT_BACKEND: falkordb
        run: |
          python -m pip install playwright==1.56.0
          uvicorn app.server:app --host 127.0.0.1 --port 8766 >/tmp/sahiaaya-fastapi.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8766/api/health >/dev/null; then break; fi
            sleep 1
          done
          python -m scripts.ui_browser_check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sahiaaya-live-graph-browser-screenshots
          path: docs/screenshots/judge-live-*.png
          if-no-files-found: ignore
