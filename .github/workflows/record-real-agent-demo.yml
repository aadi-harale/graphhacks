name: Real MCP agent browser recording
on:
  push:
    branches: [main]
    paths: [".github/workflows/record-real-agent-demo.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authentic-demo:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Run one-time real model browser recording' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      graph:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
    env:
      OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_BASE_URL: https://openrouter.ai/api/v1
      SAHIAAYA_AGENT_MODEL: openrouter/free
      FALKOR_HOST: localhost
      FALKOR_PORT: "6379"
      ALLOW_DEMO_MUTATIONS: "1"
      ALLOW_DEMO_RESET: "1"
      SAHIAAYA_UI_URL: http://127.0.0.1:8000/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check encrypted model credential
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Set secret OPENROUTER_API_KEY before the actual model demo"
            exit 1
          fi
      - name: Install application and browser
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Start real localhost application and verify graph health
        shell: bash
        run: |
          (uvicorn app.server:app --host 127.0.0.1 --port 8000 > /tmp/sahiaaya-server.log 2>&1 &)
          READY=0
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:8000/api/health >/dev/null; then READY=1;break;fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            echo "::error::Real FalkorDB backend failed health check"
            tail -n 30 /tmp/sahiaaya-server.log
            exit 1
          fi
          curl --silent --fail http://127.0.0.1:8000/api/health | python -c "import json,sys; assert json.load(sys.stdin)['backend']=='FALKORDB'; print('Live graph-backed FastAPI: OK')"
      - name: Record authentic model-selected MCP graph investigation
        run: python -m scripts.record_real_judge
      - name: Preserve real video and provenance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sahiaaya-live-judge-recording-${{ github.run_id }}
          path: recordings/
          retention-days: 7
          if-no-files-found: ignore
      - name: Explicit video provenance status
        if: always()
        shell: bash
        run: |
          if [ -f recordings/sahiaaya_live_real_model.webm ]; then
            echo "## VERIFIED local FastAPI + MCP + live FalkorDB browser capture" >> "$GITHUB_STEP_SUMMARY"
            echo "A real model ran against the temporary GitHub Actions FalkorDB service. This is not the public Vercel simulator or the user's separate FalkorDB Cloud instance." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## NOT VERIFIED — no passing real model judge recording" >> "$GITHUB_STEP_SUMMARY"
            echo "Review the logs or UNVERIFIED_attempt.webm. Do not present this as successful live evidence." >> "$GITHUB_STEP_SUMMARY"
          fi
