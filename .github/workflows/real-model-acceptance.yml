name: Private real-model acceptance (manual)
on:
  # This workflow also accepts a guarded one-time push activation.
  push:
    branches: [main]
    paths: [".github/workflows/real-model-acceptance.yml", "scripts/live_model_gate.py", "app/track1_mcp_loop.py"]
  workflow_dispatch:
    inputs:
      scenario:
        description: "One-case smoke test or full six-scenario acceptance"
        required: true
        type: choice
        default: unattributed
        options: [unattributed, all]
      model:
        description: "Model id with tool calling (OpenRouter id, or e.g. gemini-3.8-flash for Gemini)"
        required: true
        type: string
        default: openrouter/free
      provider:
        description: "openrouter (secret OPENROUTER_API_KEY) or gemini (secret GEMINI_API_KEY, Google AI Studio)"
        required: false
        type: choice
        default: openrouter
        options: [openrouter, gemini]

permissions:
  contents: read

jobs:
  private-model-test:
    name: Model choices → MCP tools → live FalkorDB
    # Future edits do not accidentally spend model credits.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Run one-time private model acceptance' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      graph:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
    env:
      OPENAI_API_KEY: ${{ inputs.provider == 'gemini' && secrets.GEMINI_API_KEY || secrets.OPENROUTER_API_KEY }}
      OPENAI_BASE_URL: ${{ inputs.provider == 'gemini' && 'https://generativelanguage.googleapis.com/v1beta/openai' || 'https://openrouter.ai/api/v1' }}
      SAHIAAYA_AGENT_MODEL: ${{ inputs.model || 'openrouter/free' }}
      FALKOR_HOST: localhost
      FALKOR_PORT: "6379"
      ALLOW_DEMO_MUTATIONS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require private GitHub Actions key
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Add the provider key as an Actions secret (OPENROUTER_API_KEY or GEMINI_API_KEY). Never commit it."
            exit 1
          fi
          echo "OpenRouter key present (value not logged)."
      - name: Diagnose provider access (status codes only, key never printed)
        shell: bash
        continue-on-error: true
        run: |
          set +e
          code=$(curl -s -o /tmp/key.json -w '%{http_code}' https://openrouter.ai/api/v1/key -H "Authorization: Bearer $OPENAI_API_KEY")
          echo "::notice title=Key check::HTTP $code $(python -c "import json;d=json.load(open('/tmp/key.json'));k=d.get('data',d);print({x:k.get(x) for x in ('limit','limit_remaining','usage','is_free_tier')})" 2>&1 | tail -1)"
          curl -s https://openrouter.ai/api/v1/models -o /tmp/models.json
          echo "::notice title=Free tool models::$(python -c "import json;m=json.load(open('/tmp/models.json'))['data'];print(sorted(x['id'] for x in m if x['id'].endswith(':free') and 'tools' in (x.get('supported_parameters') or [])))" 2>&1 | tail -1)"
          body='{"model":"'"$SAHIAAYA_AGENT_MODEL"'","max_tokens":20,"messages":[{"role":"user","content":"Say ok"}],"tools":[{"type":"function","function":{"name":"ping","description":"ping","parameters":{"type":"object","properties":{}}}}]}'
          code=$(curl -s -o /tmp/chat.json -w '%{http_code}' "$OPENAI_BASE_URL/chat/completions" -H "Authorization: Bearer $OPENAI_API_KEY" -H 'Content-Type: application/json' -d "$body")
          echo "::notice title=Chat check::model=$SAHIAAYA_AGENT_MODEL HTTP $code $(head -c 300 /tmp/chat.json | tr -d '\n' | sed 's/sk-[A-Za-z0-9_-]*/[redacted]/g')"
          exit 0
      - name: Install project requirements
        run: python -m pip install -r requirements.txt
      - name: Replay the agent's first model request (error text only)
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, os
          from openai import OpenAI, APIStatusError
          from app.track1_agent import TOOL_SCHEMAS, SYSTEM_PROMPT
          c=OpenAI()
          msgs=[{"role":"system","content":SYSTEM_PROMPT},{"role":"user","content":"Investigate fictional case X, receipt LATEST_BOX. Which promise?"}]
          for label,kw in [("as_agent",dict(tools=TOOL_SCHEMAS,tool_choice="auto",temperature=0)),
                           ("no_temperature",dict(tools=TOOL_SCHEMAS,tool_choice="auto")),
                           ("no_max_tokens",dict(tools=TOOL_SCHEMAS,tool_choice="auto",temperature=0,max_tokens=None))]:
              try:
                  kw={"max_tokens":200,**kw}; kw={k:v for k,v in kw.items() if v is not None}
                  r=c.chat.completions.create(model=os.environ["SAHIAAYA_AGENT_MODEL"],messages=msgs,**kw)
                  m=r.choices[0].message
                  print(f"::notice title=Replay {label}::OK tool_calls={[t.function.name for t in (m.tool_calls or [])]}")
              except APIStatusError as e:
                  body=json.dumps(e.body)[:400] if e.body is not None else ""
                  print(f"::warning title=Replay {label}::HTTP {e.status_code} {body}")
          PY
      - name: Verify MCP transport on temporary FalkorDB before invoking model
        env:
          RUN_FALKOR_TESTS: "1"
        run: python -m pytest -q tests/test_track1_agent.py tests/test_track1_counterfactual.py
      - name: Real model smoke — one unknown supplier case
        shell: bash
        run: python -m scripts.live_model_gate --accept-api-cost --only unattributed
      - name: Six-case real model gate after successful smoke
        if: ${{ github.event_name == 'push' || inputs.scenario == 'all' }}
        shell: bash
        run: python -m scripts.live_model_gate --accept-api-cost
      - name: Report verified outcomes (not mock results)
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          f=Path("artifacts/real_model/summary.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("## Real-model results, not an injected-model test\n\n")
              out.write("Database: temporary GitHub Actions FalkorDB, **not** user's FalkorDB Cloud.\n\n")
              if not f.exists():
                  out.write("No complete report produced. Check the job log for the error.\n")
              else:
                  d=json.loads(f.read_text())
                  out.write(f"**{d.get('passed',0)} / {d.get('total',0)} scenarios passed**.\n\n")
                  out.write(f"Different model tool sequences observed: {d.get('different_tool_sequences_observed')}.\n")
                  for k,v in d.get("statuses",{}).items():out.write(f"- {k}: {v or 'NO DECISION'}\n")
          PY
      - name: Print per-case results as annotations
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("artifacts/real_model")
          files=sorted(x for x in root.glob("*.json") if x.name!="summary.json") if root.exists() else []
          if not files: print("::warning title=Real model::No per-case results were written")
          for f in files:
              d=json.loads(f.read_text())
              trace=d.get("agent_result",{}).get("tool_trace") or d.get("failed_model_tool_trace") or []
              tools=[t.get("tool")+("(blocked)" if t.get("result_kind")=="blocked" else "") for t in trace]
              summary=(d.get("agent_result",{}).get("model_summary") or "")[:300].replace("\n"," ")
              status=d.get("agent_result",{}).get("authoritative_decision",{}).get("status") or d.get("failed_model_policy_decision")
              level="notice" if d.get("passed") else "warning"
              print(f"::{level} title=Real model {d.get('scenario')} {'PASS' if d.get('passed') else 'FAIL'}::model={d.get('model')} expected={d.get('expected_policy_status')} got={status} checks={json.dumps(d.get('checks'))} error={d.get('error')} {d.get('error_leaf_types')} tools={tools} summary={summary}")
          PY
      - name: Keep auditable synthetic results for seven days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-model-evidence-${{ github.run_id }}
          path: artifacts/real_model/
          retention-days: 7
          if-no-files-found: ignore
